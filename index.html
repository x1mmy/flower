<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bouquet &amp; Heart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Figtree:wght@400&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090909;
      --ink: #F0F0EE;
      --muted: #888884;
      --love: #ea80b0;
      --stem: #55604F;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
    }

    a {
      color: var(--ink);
      text-decoration: none;
      transition: color 180ms ease;
    }

    a:hover { color: #FFFFFF; }

    @keyframes grow { to { stroke-dashoffset: 0; } }

    @keyframes bloom {
      from { opacity: 0; transform: scale(0.04); }
      60% { opacity: 1; }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-0.7deg); }
      50% { transform: rotate(0.7deg); }
    }

    @keyframes nudge {
      0%, 100% { transform: translateY(0); opacity: 0.55; }
      50% { transform: translateY(6px); opacity: 1; }
    }

    /* Classic codingstella ribbon path — X must be ease-in-out, Y linear, Y = 2× X */
    @keyframes love-x {
      from { transform: translateX(0); }
      to { transform: translateX(450px); }
    }

    @keyframes love-y {
      0% { transform: translateY(180px); }
      10% { transform: translateY(45px); }
      15% { transform: translateY(4.5px); }
      18% { transform: translateY(0); }
      20% { transform: translateY(4.5px); }
      22% { transform: translateY(34.61538px); }
      24% { transform: translateY(64.28571px); }
      25% { transform: translateY(112.5px); }
      26% { transform: translateY(64.28571px); }
      28% { transform: translateY(34.61538px); }
      30% { transform: translateY(4.5px); }
      32% { transform: translateY(0); }
      35% { transform: translateY(4.5px); }
      40% { transform: translateY(45px); }
      50% { transform: translateY(180px); }
      71% { transform: translateY(428.57143px); }
      72.5% { transform: translateY(441.17647px); }
      75% { transform: translateY(450px); }
      77.5% { transform: translateY(441.17647px); }
      79% { transform: translateY(428.57143px); }
      100% { transform: translateY(180px); }
    }

    .bouquet {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 4vw, 24px);
      padding:
        max(clamp(32px, 8vw, 56px), env(safe-area-inset-top))
        max(clamp(16px, 5vw, 24px), env(safe-area-inset-right))
        max(clamp(28px, 6vw, 40px), env(safe-area-inset-bottom))
        max(clamp(16px, 5vw, 24px), env(safe-area-inset-left));
      overflow: hidden;
    }

    .eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.16em;
      color: var(--muted);
      animation: fadeUp 500ms cubic-bezier(.16, 1, .3, 1) both;
      animation-delay: 120ms;
    }

    .bouquet-stage {
      width: min(720px, 96vw);
      transform-origin: 50% 100%;
      animation: sway 11s ease-in-out infinite;
    }

    .bouquet-stage svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }

    .grow {
      fill: none;
      stroke: var(--stem);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 900;
      stroke-dashoffset: 900;
      animation: grow 1400ms cubic-bezier(.16, 1, .3, 1) both;
    }

    .leaf {
      fill: var(--stem);
      transform-box: fill-box;
      animation: bloom 700ms cubic-bezier(.16, 1, .3, 1) both;
    }

    .flower {
      transform-box: fill-box;
      transform-origin: center;
      animation: bloom 900ms cubic-bezier(.16, 1, .3, 1) both;
    }

    .vase {
      animation: fade 600ms ease both;
      animation-delay: 2900ms;
    }

    .caption {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      animation: fadeUp 600ms cubic-bezier(.16, 1, .3, 1) both;
      animation-delay: 3100ms;
    }

    .caption h1 {
      margin: 0;
      font-family: Syne, sans-serif;
      font-weight: 700;
      font-size: clamp(18px, 5.2vw, 30px);
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--ink);
      max-width: 22ch;
    }

    .caption-note {
      margin: 0;
      font-family: Figtree, sans-serif;
      font-size: clamp(13px, 3.2vw, 15px);
      line-height: 1.35;
      color: var(--muted);
      max-width: 28ch;
    }

    .scroll-cue {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--muted);
      padding: 8px;
    }

    .scroll-cue:hover { color: var(--ink); }

    .scroll-cue span {
      animation: nudge 2.4s ease-in-out infinite;
    }

    /* —— Heart (codingstella ribbon) —— */
    .heart-section {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(12px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
      overflow: hidden;
    }

    .heart-stage {
      --s: 0.7;
      width: calc(450px * var(--s));
      height: calc(450px * var(--s));
      position: relative;
      flex-shrink: 0;
    }

    .heart-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 450px;
      height: 450px;
      margin: -225px 0 0 -225px;
      transform: scale(var(--s));
      transform-origin: center;
    }

    .love {
      --i: 1;
      position: absolute;
      top: 50%;
      left: 50%;
      margin: -225px 0 0 -225px;
      pointer-events: none;
    }

    .love-x {
      animation: love-x 10s infinite alternate ease-in-out;
      animation-delay: calc(var(--i) * -0.3s);
    }

    .love-y {
      animation: love-y 20s infinite linear;
      animation-delay: calc(var(--i) * -0.3s);
    }

    .love-word {
      color: var(--love);
      font-family: "JetBrains Mono", monospace;
      font-size: 1.4rem;
      letter-spacing: 2px;
      white-space: nowrap;
      text-shadow: 0 0 10px #fff;
      transform: translateY(-100%) rotate(-30deg);
    }

    @media (max-width: 480px) {
      .love-word {
        font-size: 1.05rem;
        letter-spacing: 1px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .grow { stroke-dashoffset: 0; }
      .leaf, .flower, .vase, .eyebrow, .caption {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <section class="bouquet" aria-label="Bouquet">
    <div class="eyebrow">for you</div>

    <div class="bouquet-stage">
      <svg viewBox="0 0 800 720" role="img" aria-label="Animated flower bouquet">
        <defs>
          <g id="peony">
            <ellipse cx="0" cy="-36" rx="21" ry="38" fill="#C7788C" transform="rotate(0)"></ellipse>
            <ellipse cx="0" cy="-36" rx="21" ry="38" fill="#D98B9E" transform="rotate(51)"></ellipse>
            <ellipse cx="0" cy="-36" rx="21" ry="38" fill="#C7788C" transform="rotate(102)"></ellipse>
            <ellipse cx="0" cy="-36" rx="21" ry="38" fill="#D98B9E" transform="rotate(153)"></ellipse>
            <ellipse cx="0" cy="-36" rx="21" ry="38" fill="#C7788C" transform="rotate(204)"></ellipse>
            <ellipse cx="0" cy="-36" rx="21" ry="38" fill="#D98B9E" transform="rotate(255)"></ellipse>
            <ellipse cx="0" cy="-36" rx="21" ry="38" fill="#C7788C" transform="rotate(306)"></ellipse>
            <ellipse cx="0" cy="-21" rx="14" ry="24" fill="#EFC2CD" transform="rotate(26)"></ellipse>
            <ellipse cx="0" cy="-21" rx="14" ry="24" fill="#E8AEBC" transform="rotate(98)"></ellipse>
            <ellipse cx="0" cy="-21" rx="14" ry="24" fill="#EFC2CD" transform="rotate(170)"></ellipse>
            <ellipse cx="0" cy="-21" rx="14" ry="24" fill="#E8AEBC" transform="rotate(242)"></ellipse>
            <ellipse cx="0" cy="-21" rx="14" ry="24" fill="#EFC2CD" transform="rotate(314)"></ellipse>
            <circle cx="0" cy="0" r="10" fill="#F6DDE3"></circle>
          </g>
          <g id="lily">
            <path id="lilypetal" d="M0,0 C13,-27 15,-58 0,-78 C-15,-58 -13,-27 0,0" fill="#F0EBE2"></path>
            <use href="#lilypetal" transform="rotate(60)" fill="#E4DCCE"></use>
            <use href="#lilypetal" transform="rotate(120)"></use>
            <use href="#lilypetal" transform="rotate(180)" fill="#E4DCCE"></use>
            <use href="#lilypetal" transform="rotate(240)"></use>
            <use href="#lilypetal" transform="rotate(300)" fill="#E4DCCE"></use>
            <g stroke="#C79A6B" stroke-width="1.6">
              <line x1="0" y1="0" x2="9" y2="-26"></line>
              <line x1="0" y1="0" x2="-9" y2="-26"></line>
              <line x1="0" y1="0" x2="0" y2="-30"></line>
            </g>
            <circle cx="9" cy="-27" r="3" fill="#B5773F"></circle>
            <circle cx="-9" cy="-27" r="3" fill="#B5773F"></circle>
            <circle cx="0" cy="-31" r="3" fill="#B5773F"></circle>
            <circle cx="0" cy="0" r="7" fill="#D98B9E"></circle>
          </g>
          <g id="carnation">
            <path id="carnpetal" d="M0,0 C10,-14 6,-22 12,-28 C10,-20 16,-22 18,-30 C18,-22 24,-24 24,-31 C22,-14 12,-6 0,0" fill="#A64459"></path>
            <use href="#carnpetal" transform="rotate(0)"></use>
            <use href="#carnpetal" transform="rotate(40)" fill="#C4576B"></use>
            <use href="#carnpetal" transform="rotate(80)"></use>
            <use href="#carnpetal" transform="rotate(120)" fill="#C4576B"></use>
            <use href="#carnpetal" transform="rotate(160)"></use>
            <use href="#carnpetal" transform="rotate(200)" fill="#C4576B"></use>
            <use href="#carnpetal" transform="rotate(240)"></use>
            <use href="#carnpetal" transform="rotate(280)" fill="#C4576B"></use>
            <use href="#carnpetal" transform="rotate(320)" fill="#C4576B"></use>
            <use href="#carnpetal" transform="rotate(20) scale(0.62)" fill="#E08A9B"></use>
            <use href="#carnpetal" transform="rotate(92) scale(0.62)" fill="#E08A9B"></use>
            <use href="#carnpetal" transform="rotate(164) scale(0.62)" fill="#E08A9B"></use>
            <use href="#carnpetal" transform="rotate(236) scale(0.62)" fill="#E08A9B"></use>
            <use href="#carnpetal" transform="rotate(308) scale(0.62)" fill="#E08A9B"></use>
            <circle cx="0" cy="0" r="6" fill="#8E3348"></circle>
          </g>
          <g id="daisy">
            <ellipse id="daisypetal" cx="0" cy="-30" rx="7" ry="26" fill="#F5F3EC"></ellipse>
            <use href="#daisypetal" transform="rotate(30)"></use>
            <use href="#daisypetal" transform="rotate(60)"></use>
            <use href="#daisypetal" transform="rotate(90)"></use>
            <use href="#daisypetal" transform="rotate(120)"></use>
            <use href="#daisypetal" transform="rotate(150)"></use>
            <use href="#daisypetal" transform="rotate(180)"></use>
            <use href="#daisypetal" transform="rotate(210)"></use>
            <use href="#daisypetal" transform="rotate(240)"></use>
            <use href="#daisypetal" transform="rotate(270)"></use>
            <use href="#daisypetal" transform="rotate(300)"></use>
            <use href="#daisypetal" transform="rotate(330)"></use>
            <circle cx="0" cy="0" r="12" fill="#E0B45A"></circle>
            <circle cx="0" cy="0" r="7" fill="#C8973F"></circle>
          </g>
        </defs>

        <g>
          <path class="grow" d="M400,700 Q330,470 190,180" style="animation-delay:200ms"></path>
          <path class="grow" d="M400,700 Q380,420 330,145" style="animation-delay:340ms"></path>
          <path class="grow" d="M400,700 Q430,420 500,170" style="animation-delay:480ms"></path>
          <path class="grow" d="M400,700 Q470,470 615,215" style="animation-delay:620ms"></path>
          <path class="grow" d="M400,700 Q320,500 250,295" style="animation-delay:760ms"></path>
          <path class="grow" d="M400,700 Q400,480 410,270" style="animation-delay:900ms"></path>
          <path class="grow" d="M400,700 Q490,520 565,325" style="animation-delay:1040ms"></path>
          <path class="grow" d="M400,700 Q285,540 160,340" style="animation-delay:1180ms"></path>
          <path class="grow" d="M400,700 Q345,565 300,405" style="animation-delay:1320ms"></path>
          <path class="grow" d="M400,700 Q470,575 520,425" style="animation-delay:1460ms"></path>
        </g>

        <g>
          <ellipse class="leaf" cx="352" cy="510" rx="36" ry="12" transform="rotate(-24 352 510)" style="transform-origin:100% 50%; animation-delay:1500ms"></ellipse>
          <ellipse class="leaf" cx="452" cy="555" rx="31" ry="11" transform="rotate(22 452 555)" style="transform-origin:0% 50%; animation-delay:1620ms"></ellipse>
          <ellipse class="leaf" cx="366" cy="612" rx="27" ry="10" transform="rotate(-16 366 612)" style="transform-origin:100% 50%; animation-delay:1740ms"></ellipse>
        </g>

        <g transform="translate(330,145)"><use class="flower" href="#peony" style="animation-delay:1560ms"></use></g>
        <g transform="translate(500,170) scale(0.92)"><use class="flower" href="#peony" style="animation-delay:1700ms"></use></g>
        <g transform="translate(300,405) scale(0.66)"><use class="flower" href="#peony" style="animation-delay:2680ms"></use></g>

        <g transform="translate(190,180)"><use class="flower" href="#lily" style="animation-delay:1420ms"></use></g>
        <g transform="translate(615,215) rotate(18) scale(0.88)"><use class="flower" href="#lily" style="animation-delay:1840ms"></use></g>

        <g transform="translate(250,295) scale(0.86)"><use class="flower" href="#carnation" style="animation-delay:1980ms"></use></g>
        <g transform="translate(410,270) rotate(14)"><use class="flower" href="#carnation" style="animation-delay:2120ms"></use></g>
        <g transform="translate(520,425) scale(0.7)"><use class="flower" href="#carnation" style="animation-delay:2820ms"></use></g>

        <g transform="translate(565,325) scale(0.9)"><use class="flower" href="#daisy" style="animation-delay:2260ms"></use></g>
        <g transform="translate(160,340) rotate(-12) scale(0.82)"><use class="flower" href="#daisy" style="animation-delay:2400ms"></use></g>

        <g class="vase">
          <path d="M352,700 L340,660 Q400,644 460,660 L448,700 Z" fill="none" stroke="#333333" stroke-width="1.5"></path>
          <path d="M340,672 Q400,656 460,672" fill="none" stroke="#333333" stroke-width="1.5"></path>
        </g>
      </svg>
    </div>

    <div class="caption">
      <h1>peonies, lilies, carnations, daisies</h1>
      <p class="caption-note">(all the flowers you like, u told me)</p>
      <a class="scroll-cue" href="#heart">
        scroll down for a little something
        <span aria-hidden="true">↓</span>
      </a>
    </div>
  </section>

  <section id="heart" class="heart-section" aria-label="I love you heart">
    <div class="heart-stage" id="heart-stage">
      <div class="heart-frame" id="heart-frame" role="img" aria-label="Animated heart made of the words I love you"></div>
    </div>
  </section>

  <script>
    (function () {
      const stage = document.getElementById("heart-stage");
      const frame = document.getElementById("heart-frame");
      if (!stage || !frame) return;

      const count = 100;
      const frag = document.createDocumentFragment();

      for (let i = 1; i <= count; i++) {
        const love = document.createElement("div");
        love.className = "love";
        love.style.setProperty("--i", String(i));
        love.innerHTML =
          '<div class="love-x"><div class="love-y"><div class="love-word">I love you</div></div></div>';
        frag.appendChild(love);
      }

      frame.appendChild(frag);

      function fitHeart() {
        const pad = 24;
        const avail = Math.min(
          window.innerWidth - pad,
          window.innerHeight * 0.85
        );
        stage.style.setProperty("--s", String(Math.min(1, avail / 450)));
      }

      fitHeart();
      window.addEventListener("resize", fitHeart, { passive: true });
    })();
  </script>
</body>
</html>
