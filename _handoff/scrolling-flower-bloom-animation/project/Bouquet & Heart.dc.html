<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    const rings = [
      { scale: 1.00, n: 46, size: 'clamp(8px, 2.1vw, 13px)' },
      { scale: 0.86, n: 40, size: 'clamp(7.5px, 1.95vw, 12px)' },
      { scale: 0.72, n: 34, size: 'clamp(7px, 1.8vw, 11px)' }
    ];
    const words = [];
    rings.forEach((ring, r) => {
      for (let i = 0; i < ring.n; i++) {
        const t = (i / ring.n) * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        // tangent for rotation
        const dx = 48 * Math.pow(Math.sin(t), 2) * Math.cos(t);
        const dy = 13 * Math.sin(t) - 10 * Math.sin(2 * t) - 6 * Math.sin(3 * t) - 4 * Math.sin(4 * t);
        let deg = Math.atan2(dy, dx) * 180 / Math.PI;
        if (deg > 90) deg -= 180;
        if (deg < -90) deg += 180;
        const px = 50 + (x * ring.scale) * 2.6;
        const py = 50 - (y * ring.scale) * 2.6;
        words.push({
          left: px.toFixed(2) + '%',
          top: py.toFixed(2) + '%',
          tf: `translate(-50%,-50%) rotate(${deg.toFixed(1)}deg)`,
          size: ring.size,
          delay: (r * 260 + i * 22) + 'ms',
          hdelay: (-300 * i) + 'ms'
        });
      }
    });
    return { words };
  }
}
</script>
